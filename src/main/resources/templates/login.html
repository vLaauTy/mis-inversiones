<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: head('Entrar')}"></head>
<body class="pagina-login">
<main class="login">
    <h1>Mis Inversiones</h1>
    <p class="aviso error" role="alert" th:if="${param.error}">Usuario o contraseña incorrectos.</p>
    <p class="aviso ok" role="status" th:if="${param.salir}">Saliste de la app.</p>
    <form th:action="@{/login}" method="post" class="tarjeta formulario">
        <label for="username">Usuario</label>
        <input id="username" name="username" autocomplete="username" required autofocus>
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <label class="check"><input type="checkbox" name="remember-me" checked> Recordarme en este dispositivo</label>
        <button type="submit" class="boton">Entrar</button>
    </form>
</main>
</body>
</html>
