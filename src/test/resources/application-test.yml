spring:
  datasource:
    url: jdbc:h2:mem:pruebas;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      enabled: false
app:
  precios:
    # Los tests nunca salen a internet: las fuentes se prueban con un servidor simulado.
    automaticos: false
    # Direcciones que no responden: si algún test dispara una actualización, las fuentes fallan rápido.
    byma-url: http://localhost:9/byma
    data912-url: http://localhost:9/data912
    dolar-url: http://localhost:9/dolar
